version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            # Flutter SDK version; bump alongside local development (ADR 0010)
            - export FLUTTER_VERSION=3.47.7
            # Reuse the cached SDK only if it is this version; otherwise replace it
            # (extracting over an older cached SDK fails). The marker is written
            # only after a complete extract.
            - |
              if [ "$(cat flutter/.amplify-version 2>/dev/null)" != "$FLUTTER_VERSION" ]; then
                rm -rf flutter flutter.tar.xz &&
                { command -v xz || sudo yum install -y xz; } &&
                wget -q "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" -O flutter.tar.xz &&
                tar xf flutter.tar.xz &&
                rm flutter.tar.xz &&
                echo "$FLUTTER_VERSION" > flutter/.amplify-version
              fi
            # Add Flutter to PATH
            - export PATH="$PATH:`pwd`/flutter/bin"
            # Verify Flutter installation
            - flutter doctor
            - flutter pub get
        build:
          commands:
            - export PATH="$PATH:`pwd`/flutter/bin"
            - flutter build web --release
      artifacts:
        baseDirectory: build/web
        files:
          - '**/*'
      cache:
        paths:
          - flutter/**/*
          - ~/.pub-cache/**/*
          - .dart_tool/**/*
