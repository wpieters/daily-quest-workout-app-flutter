<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Daily Quest workout tracker inspired by One Punch Man and Solo Leveling">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!--
    iOS 26+ draws a blurred strip over the top of standalone PWAs. "default"
    starts the web view below the status bar; together with the opaque fixed
    #ios-status-strip div in <body> this stops the blur (ADR 0015). Neither
    change works on its own.
  -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DailyQuest">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="theme-color" content="#0F131A">
  <title>DailyQuest</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Must be a real element, not ::before, and must have no backdrop-filter. */
    #ios-status-strip {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 12px;
      background: #0F131A;
      z-index: 2147483647;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="ios-status-strip"></div>
  <!-- Web Push reminders (ADR 0012); Flutter calls window.dqPush -->
  <script src="push.js"></script>
  <script src="backup.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
