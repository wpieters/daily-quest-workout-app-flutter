name: daily_quest
description: A workout tracker app inspired by One Punch Man/Solo Leveling with anime-style progression rewards.
publish_to: 'none'

version: 1.0.0+1

# Pinned to the toolchain used locally; the Amplify build image must match.
environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^3.4.3
  
  # Local Storage
  shared_preferences: ^2.5.6
  
  # Haptic Feedback
  vibration: ^3.2.1

  # Icons used by Flutter's Cupertino/adaptive widgets
  cupertino_icons: ^2.0.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Pixel art from Tiny RPG Battle Kit I, CC BY 4.0 (assets/sprites/LICENSE.md)
  assets:
    - assets/sprites/20240926bundleFighter3f.png
    - assets/sprites/20221110bundleFireFX-Sheet.png
    - assets/sprites/20221110bundleThunderFX-Sheet.png
    - assets/sprites/20221110bundleReviveFX-Sheet.png
